spring:
  application:
    name: atalaya
  profiles:
    default: qa
  # H2 embebida con nombre único por contexto: dos contextos de Spring en la misma JVM (tests con
  # perfil qa y prod) no comparten la base. Si la comparten, el tick de prod escala alertas de qa.
  datasource:
    generate-unique-name: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

atalaya:
  version:
    software: 3.1.0
    modelo: simulado-1.0

management:
  endpoints:
    web:
      exposure:
        include: health
